<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría de Cartera · GLOBALAS</title>
<style>
:root{ color-scheme: light; --azul:#1F5FA8; --negro:#111; --rojo:#C0392B; --amar:#B8860B; --verde:#1E8449;
 --rojobg:#F7D6D1; --amarbg:#FBEFC7; --verdebg:#D6ECDD; --gris:#EEE; --grisos:#555; --linea:#DDD;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#111;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.head{background:var(--negro);color:#fff;border-bottom:3px solid var(--azul);border-radius:8px 8px 0 0;
 display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;letter-spacing:1px}
.head .sub{font-size:12px;color:#BFD3EC;text-align:right;line-height:1.4}
.legend{background:var(--gris);padding:8px 14px;border-radius:0 0 8px 8px;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dot{font-weight:700}.dot.r{color:var(--rojo)}.dot.a{color:var(--amar)}.dot.v{color:var(--verde)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{border-radius:8px;padding:12px;color:#fff;text-align:center}
.kpi .t{font-size:11px;font-weight:700;opacity:.95}.kpi .v{font-size:22px;font-weight:800;margin:2px 0}.kpi .s{font-size:11px;opacity:.9}
.kpi.tot{background:var(--azul)}.kpi.r{background:var(--rojo)}.kpi.a{background:var(--amar)}.kpi.v{background:var(--verde)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:6px 0 12px;padding:12px;border:1px solid var(--linea);border-radius:8px;background:#FAFAFB}
.controls label{display:flex;flex-direction:column;font-size:11px;color:var(--grisos);font-weight:700;gap:3px}
.controls select,.controls input{font-size:13px;padding:7px 9px;border:1px solid #C9C9C9;border-radius:6px;background:#fff;min-width:150px}
.controls input#q{min-width:230px}
.btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
button{font-size:13px;font-weight:700;padding:9px 14px;border-radius:6px;border:1px solid var(--azul);cursor:pointer}
button.pri{background:var(--azul);color:#fff}button.sec{background:#fff;color:var(--azul)}
button.ghost{background:#fff;color:var(--grisos);border-color:#C9C9C9}
.tabsw{display:inline-flex;border:1px solid #C9C9C9;border-radius:6px;overflow:hidden}
.tabsw button{border:none;border-radius:0;background:#fff;color:var(--grisos)}
.tabsw button.on{background:var(--negro);color:#fff}
.meta{font-size:12px;color:var(--grisos);margin:4px 2px 10px}
.tablewrap{border:1px solid var(--linea);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid #ECECEC;text-align:left;vertical-align:middle}
th{background:var(--negro);color:#fff;position:sticky;top:0;cursor:pointer;white-space:nowrap;font-size:11px}
th .ar{opacity:.5;font-size:10px}
td.num,th.num{text-align:right}td.ctr,th.ctr{text-align:center}
tr.r{background:var(--rojobg)}tr.a{background:var(--amarbg)}tr.v{background:var(--verdebg)}
.sem{font-weight:700;white-space:nowrap}.sem.r{color:var(--rojo)}.sem.a{color:var(--amar)}.sem.v{color:var(--verde)}
.note{font-size:11px;color:var(--grisos);margin:8px 2px}
.printhead{display:none}
@media print{
 body{font-size:10px}.wrap{max-width:none;padding:0}
 .controls,.legend,.btns,.kpis .s,.tabsw{display:none !important}
 .kpis{grid-template-columns:repeat(4,1fr);gap:6px}
 .head{border-radius:0}
 .printhead{display:block;margin:6px 0;font-size:11px;color:#000}
 .tablewrap{border:none;overflow:visible}
 th{position:static}
 @page{size:landscape;margin:10mm}
}
</style>
</head>

    <div class="btns">

      <button class="pri" onclick="window.print()">Descargar PDF</button>

  </div>
  <div class="meta" id="meta"></div>
  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="note" id="note"></div>
</div>

let SEC='aseg';
let sort={key:'dias_cartera',dir:-1};
const money=v=>'$'+Math.round(v).toLocaleString('es-CO');
const COLS={
 aseg:[['aseguradora','Aseguradora','t'],['tomador','Tomador / Cliente','t'],['poliza','Póliza','t'],
   ['ramo','Ramo','t'],['inicio_vig','Inicio vig.','c'],['dias_cartera','Días cartera','c'],
   ['saldo','Saldo por pagar','n'],['semaforo','Semáforo','c']],
 fin:[['financiera','Financiera','t'],['cliente','Cliente','t'],['aseguradora','Aseg./Ramo','t'],
   ['poliza','Póliza','t'],['placa','Placa','c'],['dias_mora','Días mora','c'],
   ['saldo','Saldo','n'],['estado','Estado','t'],['semaforo','Semáforo','c']]
};
const semClass=s=>s==='ROJO'?'r':s==='AMARILLO'?'a':'v';
function rows(){return SEC==='aseg'?DATA.aseguradoras:DATA.financieras;}
function nameField(){return SEC==='aseg'?'tomador':'cliente';}

function fillClientes(){
 const nf=nameField();
 const names=[...new Set(rows().map(r=>r[nf]))].sort((a,b)=>a.localeCompare(b));
 const sel=document.getElementById('cliente');
 sel.innerHTML='<option value="">— Todos —</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
}
function fillAseg(){
 const names=[...new Set(DATA.aseguradoras.map(r=>r.aseguradora))].sort();
 document.getElementById('aseg').innerHTML='<option value="">— Todas —</option>'+names.map(n=>`<option>${n}</option>`).join('');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function filtered(){
 const nf=nameField();
 const cli=document.getElementById('cliente').value;
 const ag=document.getElementById('aseg').value;
 const sm=document.getElementById('sem').value;
 const q=document.getElementById('q').value.trim().toLowerCase();
 let out=rows().filter(r=>{
   if(cli && r[nf]!==cli) return false;
   if(SEC==='aseg' && ag && r.aseguradora!==ag) return false;
   if(sm && r.semaforo!==sm) return false;
   if(q){const blob=Object.values(r).join(' ').toLowerCase(); if(!blob.includes(q)) return false;}
   return true;
 });
 const k=sort.key;
 out.sort((a,b)=>{let x=a[k],y=b[k];
   if(typeof x==='number'||typeof y==='number'){x=x==null?-1e15:x;y=y==null?-1e15:y;return (x-y)*sort.dir;}
   return String(x).localeCompare(String(y))*sort.dir;});
 return out;
}

function render(){
 const cols=COLS[SEC], data=filtered();
 // KPIs
 const tot=data.reduce((s,r)=>s+r.saldo,0);
 const grp=s=>{const x=data.filter(r=>r.semaforo===s);return[x.length,x.reduce((a,r)=>a+r.saldo,0)];};
 const [nr,mr]=grp('ROJO'),[na,ma]=grp('AMARILLO'),[nv,mv]=grp('VERDE');
 document.getElementById('kpis').innerHTML=`
  <div class="kpi tot"><div class="t">TOTAL (VISTA ACTUAL)</div><div class="v">${money(tot)}</div><div class="s">${data.length} registros</div></div>
  <div class="kpi r"><div class="t">ROJO ≥30 días</div><div class="v">${money(mr)}</div><div class="s">${nr} pólizas</div></div>
  <div class="kpi a"><div class="t">AMARILLO 20–29</div><div class="v">${money(ma)}</div><div class="s">${na} pólizas</div></div>
  <div class="kpi v"><div class="t">VERDE &lt;20 días</div><div class="v">${money(mv)}</div><div class="s">${nv} pólizas</div></div>`;
 // head
 const thead=document.querySelector('#tbl thead');
 thead.innerHTML='<tr><th class="ctr">#</th>'+cols.map(c=>{
   const cls=c[2]==='n'?'num':c[2]==='c'?'ctr':'';
   const ar=sort.key===c[0]?(sort.dir<0?'▼':'▲'):'';
   return `<th class="${cls}" onclick="setSort('${c[0]}')">${c[1]} <span class="ar">${ar}</span></th>`;}).join('')+'</tr>';
 // body
 const tb=document.querySelector('#tbl tbody');
 tb.innerHTML=data.map((r,i)=>{
   const tds=cols.map(c=>{
     let v=r[c[0]];const cls=c[2]==='n'?'num':c[2]==='c'?'ctr':'';
     if(c[0]==='saldo') v=money(v);
     else if(c[0]==='dias_cartera'){v=(v==null?'s/f':(v<0?'0*':v));}
     else if(c[0]==='dias_mora'){v=(v==null?'—':v);}
     else if(c[0]==='inicio_vig'){v=v||'—';}
     else if(c[0]==='semaforo'){return `<td class="ctr sem ${semClass(r.semaforo)}">● ${r.semaforo}</td>`;}
     else if(c[0]==='placa'||c[0]==='estado'){v=v||'—';}
     return `<td class="${cls}">${esc(v)}</td>`;}).join('');
   return `<tr class="${semClass(r.semaforo)}"><td class="ctr">${i+1}</td>${tds}</tr>`;}).join('');
 // meta + note
 const cli=document.getElementById('cliente').value;
 document.getElementById('meta').textContent=`${data.length} registros · Total ${money(tot)}`+(cli?` · Cliente: ${cli}`:'');
 document.getElementById('note').innerHTML = SEC==='aseg'
   ? '* Días = 0: vigencia inicia en fecha futura (emitida y con saldo, aún sin días en cartera). Zurich es del 3-jul (no actualizado); Bolívar por OCR (verificar fechas). Se excluyó la colectiva 4G ARCHITECTURE SAS.'
   : 'Primas financiadas: la métrica es días de MORA de la financiación (no días en cartera). El cliente le debe a la financiera.';
 // print header
 document.getElementById('printhead').innerHTML=
   `<b>Relación de cartera — ${SEC==='aseg'?'Aseguradoras':'Financiadas'}</b>`+
   (cli?` · Cliente: ${esc(cli)}`:' · Todos los clientes')+
   ` · ${data.length} registros · Total ${money(tot)} · Corte 10-jul-2026`;
}
function setSort(k){ if(sort.key===k) sort.dir*=-1; else {sort.key=k; sort.dir=(k==='saldo'||k==='dias_cartera'||k==='dias_mora')?-1:1;} render(); }
function setSec(s){ SEC=s; sort={key:(s==='aseg'?'dias_cartera':'dias_mora'),dir:-1};
 document.getElementById('tabA').classList.toggle('on',s==='aseg');
 document.getElementById('tabF').classList.toggle('on',s==='fin');
 document.getElementById('lblAseg').style.display=(s==='aseg')?'flex':'none';
 document.getElementById('cliente').value=''; document.getElementById('aseg').value='';
 document.getElementById('sem').value=''; document.getElementById('q').value='';
 fillClientes(); render(); }
function clearF(){document.getElementById('cliente').value='';document.getElementById('aseg').value='';
 document.getElementById('sem').value='';document.getElementById('q').value='';render();}
function expCSV(){
 const cols=COLS[SEC],data=filtered();
 const head=['#',...cols.map(c=>c[1])];
 const lines=[head.join(';')];
 data.forEach((r,i)=>{const row=[i+1,...cols.map(c=>{let v=r[c[0]];if(v==null)v='';return String(v).replace(/;/g,',');})];lines.push(row.join(';'));});
 const cli=document.getElementById('cliente').value;
 const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='Cartera_GLOBALAS_'+(SEC)+(cli?('_'+cli.replace(/[^a-z0-9]+/gi,'_')):'')+'_2026-07-10.csv';
 a.click();
}
['cliente','aseg','sem'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('q').addEventListener('input',render);
fillAseg(); fillClientes(); render();
</script>
